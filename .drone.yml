kind: pipeline
type: kubernetes
name: lint

trigger:
  branch:
    - main
    - master
  event:
    - push
    - tag

steps:
  - name: syntax-check
    image: php:8.4-cli
    commands:
      - find app public bin -name '*.php' -print0 | xargs -0 -n1 php -l

  - name: install-dev-deps
    image: composer:2
    commands:
      - composer install --no-interaction --prefer-dist

---
kind: pipeline
type: kubernetes
name: deploy

trigger:
  event:
    - tag
  ref:
    - refs/tags/v*

depends_on:
  - lint

steps:
  - name: deploy
    image: appleboy/drone-ssh
    environment:
      GITEA_TOKEN:
        from_secret: gitea_token
      DRONE_TAG: ${DRONE_TAG}
    settings:
      host:
        - "ssh.frotheim.project.host"
      username: "ssh-h7qqf0@a-m03740"
      key:
        from_secret: ssh_key
      port: 22
      command_timeout: 60s
      envs:
        - gitea_token
        - drone_tag
      script_stop: true
      script:
        - set -e
        - REPO_URL="https://$${GITEA_TOKEN}@gitea.sam-services.de/sam-services/MiniMon.git"
        - echo "Deploying tag $${DRONE_TAG}..."
        - cd /html/minimon
        - if [ ! -d .git ]; then git init && git remote add origin "$$REPO_URL"; fi
        - git remote set-url origin "$$REPO_URL"
        - git fetch origin --tags
        - git checkout "$${DRONE_TAG}"
        - bash deploy.sh "$${DRONE_TAG}"
