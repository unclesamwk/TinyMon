<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0091ff"/>
      <stop offset="100%" style="stop-color:#005ecb"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Heartbeat/pulse line - classic ECG shape, vertically centered -->
  <polyline
    points="56,280 130,280 160,280 190,280 210,180 232,360 254,140 276,340 298,230 320,280 350,280 420,280 456,280"
    fill="none"
    stroke="#ffffff"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
