<div class="page" data-name="home">
    <div class="navbar">
        <div class="navbar-bg"></div>
        <div class="navbar-inner">
            <div class="left">
                <a class="link" href="#" style="pointer-events: none">
                    <img
                        src="/assets/images/logo.svg"

            </div>
            <div class="title">MiniMon</div>
            <div class="right">
