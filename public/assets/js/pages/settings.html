<div class="page" data-name="settings">
    <div class="navbar">
        <div class="navbar-bg"></div>
        <div class="navbar-inner">
            <div class="left">
                <a href="#" class="link back"
                    ><i class="icon icon-back"></i
                    ><span class="if-not-md">Back</span></a
                >
            </div>
            <div class="title">Einstellungen</div>
        </div>
    </div>
    <div class="page-content">
        <div class="block-title">Benachrichtigungen</div>
        <div class="list">
            <ul>
                <li>
                    <label class="item-content">
                        <div class="item-inner">
                            <div class="item-title">Push Notifications</div>
                            <div class="item-after">
                                <div class="toggle toggle-init">
                                    <input
                                        type="checkbox"
                                        id="settings-push"
                                    /><span class="toggle-icon"></span>
                                </div>
                            </div>
                        </div>
                    </label>
                </li>
                <li>
                    <div class="item-content">
                        <div class="item-inner">
                            <div class="item-title">Test-Benachrichtigung</div>
                            <div class="item-after">
                                <button
                                    class="button button-small button-outline"
                                    id="push-test-btn"
                                >
                                    Senden
                                </button>
                            </div>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
        <div class="block-title">Darstellung</div>
        <div class="list">
            <ul>
                <li class="item-content">
                    <div class="item-inner">
                        <div class="item-title">Dark Mode</div>
                        <div class="item-after">
                            <div
                                class="segmented segmented-strong"
                                style="width: 180px"
                            >
                                <button
                                    class="button button-small darkmode-btn"
                                    data-mode="auto"
                                >
                                    Auto
                                </button>
                                <button
                                    class="button button-small darkmode-btn"
                                    data-mode="off"
                                >
                                    Aus
                                </button>
                                <button
                                    class="button button-small darkmode-btn"
                                    data-mode="on"
                                >
                                    An
                                </button>
                                <span class="segmented-highlight"></span>
                            </div>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
        <div class="block-title">Info</div>
        <div class="list">
            <ul>
                <li class="item-content">
                    <div class="item-inner">
                        <div class="item-title">Runner</div>
                        <div class="item-after" id="settings-runner">-</div>
                    </div>
                </li>
                <li class="item-content">
                    <div class="item-inner">
                        <div class="item-title">Version</div>
                        <div class="item-after" id="settings-version">-</div>
                    </div>
                </li>
                <li class="item-content">
                    <div class="item-inner">
                        <div class="item-title">Hosts</div>
                        <div class="item-after" id="settings-host-count">-</div>
                    </div>
                </li>
                <li class="item-content">
                    <div class="item-inner">
                        <div class="item-title">Checks</div>
                        <div class="item-after" id="settings-check-count">
                            -
                        </div>
                    </div>
                </li>
            </ul>
        </div>
        <div class="block" style="margin-top: 2rem">
            <button class="button button-fill color-red" id="logout-btn">
                Abmelden
            </button>
        </div>
    </div>
</div>
