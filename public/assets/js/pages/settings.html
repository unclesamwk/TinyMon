<div class="page" data-name="settings">
    <div class="navbar">
        <div class="navbar-bg"></div>
        <div class="navbar-inner">
            <div class="left">
                <a href="#" class="link back"
                    ><i class="icon icon-back"></i
                    ><span class="if-not-md">Back</span></a
                >
            </div>
            <div class="title">Einstellungen</div>
        </div>
    </div>
    <div class="page-content">
        <div class="block-title">Benachrichtigungen</div>
        <div class="list">
            <ul>
                <li>
                    <label class="item-content">
                        <div class="item-inner">
                            <div
                                class="item-title"
                                data-i18n="push_notifications"
                            >
                                Push Notifications
                            </div>
                            <div class="item-after">
                                <div class="toggle toggle-init">
                                    <input
                                        type="checkbox"
                                        id="settings-push"
                                    /><span class="toggle-icon"></span>
                                </div>
                            </div>
                        </div>
                    </label>
                </li>
                <li>
                    <div class="item-content">
                        <div class="item-inner">
                            <div
                                class="item-title"
                                data-i18n="test_notification"
                            >
                                Test-Benachrichtigung
                            </div>
                            <div class="item-after">
                                <button
                                    class="button button-small button-outline"
                                    id="push-test-btn"
                                >
                                    Senden
                                </button>
                            </div>
                        </div>
                    </div>
                </li>
                <li>
                    <div class="item-content">
                        <div class="item-inner">
                            <div class="item-title" data-i18n="alert_threshold">
                                Alert Threshold
                            </div>
                            <div class="item-after">
                                <input
                                    type="number"
                                    id="settings-alert-threshold"
                                    value="1"
                                    min="1"
                                    max="10"
                                    step="1"
                                    inputmode="numeric"
                                    style="width: 60px; text-align: center"
                                />
                            </div>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
        <div class="block-title">Darstellung</div>
        <div class="list">
            <ul>
                <li class="item-content">
                    <div class="item-inner">
                        <div class="item-title" data-i18n="dark_mode">
                            Dark Mode
                        </div>
                        <div class="item-after">
                            <div
                                class="segmented segmented-strong"
                                style="width: 180px"
                            >
                                <button
                                    class="button button-small darkmode-btn"
                                    data-mode="auto"
                                >
                                    Auto
                                </button>
                                <button
                                    class="button button-small darkmode-btn"
                                    data-mode="off"
                                >
                                    Aus
                                </button>
                                <button
                                    class="button button-small darkmode-btn"
                                    data-mode="on"
                                >
                                    An
                                </button>
                                <span class="segmented-highlight"></span>
                            </div>
                        </div>
                    </div>
                </li>
                <li class="item-content">
                    <div class="item-inner">
                        <div class="item-title" data-i18n="theme">Theme</div>
                        <div class="item-after">
                            <div
                                class="segmented segmented-strong"
                                style="width: 220px"
                            >
                                <button
                                    class="button button-small theme-btn"
                                    data-theme="auto"
                                >
                                    Auto
                                </button>
                                <button
                                    class="button button-small theme-btn"
                                    data-theme="ios"
                                >
                                    iOS
                                </button>
                                <button
                                    class="button button-small theme-btn"
                                    data-theme="md"
                                >
                                    Android
                                </button>
                                <span class="segmented-highlight"></span>
                            </div>
                        </div>
                    </div>
                </li>
                <li class="item-content">
                    <div class="item-inner">
                        <div class="item-title" data-i18n="time_format">
                            Zeitformat
                        </div>
                        <div class="item-after">
                            <div
                                class="segmented segmented-strong"
                                style="width: 120px"
                            >
                                <button
                                    class="button button-small timeformat-btn"
                                    data-format="24h"
                                >
                                    24h
                                </button>
                                <button
                                    class="button button-small timeformat-btn"
                                    data-format="12h"
                                >
                                    12h
                                </button>
                                <span class="segmented-highlight"></span>
                            </div>
                        </div>
                    </div>
                </li>
                <li class="item-content">
                    <div class="item-inner">
                        <div class="item-title" data-i18n="language">
                            Sprache
                        </div>
                        <div class="item-after">
                            <div
                                class="segmented segmented-strong"
                                style="width: 120px"
                            >
                                <button
                                    class="button button-small lang-btn"
                                    data-lang="de"
                                >
                                    DE
                                </button>
                                <button
                                    class="button button-small lang-btn"
                                    data-lang="en"
                                >
                                    EN
                                </button>
                                <span class="segmented-highlight"></span>
                            </div>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
        <div class="block-title">Info</div>
        <div class="list">
            <ul>
                <li class="item-content">
                    <div class="item-inner">
                        <div class="item-title" data-i18n="runner">Runner</div>
                        <div class="item-after" id="settings-runner">-</div>
                    </div>
                </li>
                <li class="item-content">
                    <div class="item-inner">
                        <div class="item-title" data-i18n="version">
                            Version
                        </div>
                        <div class="item-after" id="settings-version">-</div>
                    </div>
                </li>
                <li class="item-content">
                    <div class="item-inner">
                        <div class="item-title" data-i18n="hosts">Hosts</div>
                        <div class="item-after" id="settings-host-count">-</div>
                    </div>
                </li>
                <li class="item-content">
                    <div class="item-inner">
                        <div class="item-title" data-i18n="checks">Checks</div>
                        <div class="item-after" id="settings-check-count">
                            -
                        </div>
                    </div>
                </li>
            </ul>
        </div>
        <div class="block" style="margin-top: 2rem">
            <button class="button button-fill color-red" id="logout-btn">
                Abmelden
            </button>
        </div>
    </div>
</div>
