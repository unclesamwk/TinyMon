<div class="page" data-name="host-detail">
    <div class="navbar">
        <div class="navbar-bg"></div>
        <div class="navbar-inner">
            <div class="left">
                <a href="#" class="link back"
                    ><i class="icon icon-back"></i
                    ><span class="if-not-md">Back</span></a
                >
            </div>
            <div class="title" id="host-title">Host</div>
            <div class="right">
                <a href="#" class="link" id="edit-host-btn"
                    ><i class="icon f7-icons if-ios">pencil</i
                    ><i class="icon material-icons if-md">edit</i></a
                >
            </div>
        </div>
    </div>
    <div class="page-content">
        <div class="block" id="host-info" style="margin-top: 1rem"></div>
        <div
            class="block-title"
            style="
                display: flex;
                justify-content: space-between;
                align-items: center;
            "
        >
            <span data-i18n="checks">Checks</span>
            <div
                class="segmented segmented-strong"
                id="chart-range-selector"
                style="width: 260px"
            >
                <button
                    class="button button-small chart-range-btn button-active"
                    data-range="1h"
                >
                    1h
                </button>
                <button
                    class="button button-small chart-range-btn"
                    data-range="24h"
                >
                    24h
                </button>
                <button
                    class="button button-small chart-range-btn"
                    data-range="7d"
                >
                    <span data-i18n="7_days">7 Tage</span>
                </button>
                <button
                    class="button button-small chart-range-btn"
                    data-range="30d"
                >
                    <span data-i18n="30_days">30 Tage</span>
                </button>
                <span class="segmented-highlight"></span>
            </div>
        </div>
        <div id="check-list"></div>
        <div class="block">
            <a href="#" class="button button-fill" id="add-check-btn"
                >Check hinzufügen</a
            >
        </div>
        <div class="block">
            <a
                href="#"
                class="button button-fill color-red"
                id="delete-host-btn"
                >Host löschen</a
            >
        </div>
    </div>
</div>
